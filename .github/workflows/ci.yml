name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Check shell scripts
        run: |
          shopt -s nullglob
          files=(scripts/*.sh tests/*.sh)
          if [ ${#files[@]} -eq 0 ]; then echo "No shell scripts yet."; exit 0; fi
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck "${files[@]}"

      - name: Check dashboard JavaScript parses
        run: for f in dashboard/js/*.js; do node --check "$f"; done

  changes:
    # Decides whether the lab job is needed: only when lab-related files changed
    # (always on manual runs). Dashboard-only or docs-only pushes run just `unit`.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lab: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.lab == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lab:
              - 'scripts/**'
              - 'lab/**'
              - 'backend/**'
              - 'company_app/**'
              - 'tests/**'
              - 'requirements.txt'
              - '.env.example'
              - '.github/workflows/ci.yml'

  lab:
    # The repo is public, so the free ARM runner is used (matches Isaac's Ubuntu ARM64 VM).
    # If the repo becomes private, change the matrix value to ubuntu-24.04 (x86); the
    # scripts do not depend on the CPU architecture.
    needs: [unit, changes]
    if: needs.changes.outputs.lab == 'true'
    strategy:
      matrix:
        runner: [ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Runner info
        run: |
          uname -m
          . /etc/os-release && echo "$PRETTY_NAME"
          ls /usr/lib/postgresql 2>/dev/null || echo "no PostgreSQL server preinstalled"

      # Non-interactive, .env.example defaults (AI_MODE=mock). The runner has PostgreSQL
      # installed but stopped and Docker's firewall rules loaded; install.sh must cope.
      - name: install.sh (first run)
        run: sudo CI=1 ./scripts/install.sh

      - name: install.sh (second run, must be safe to rerun)
        run: sudo CI=1 ./scripts/install.sh

      # Expected-outcomes table from docs/LAB_INTERFACE.md against the real lab,
      # setup/reset three times, then teardown.
      - name: Integration test (real lab)
        run: sudo tests/integration.sh

      # Full workflow through the backend, the same calls the dashboard makes, for both
      # mock-AI scenarios. start.sh brings the lab back up (integration.sh tore it down).
      - name: API flow (backend + real lab, scenarios A and B)
        run: |
          set -euo pipefail
          for S in A B; do
            sudo MOCK_AI_SCENARIO=$S ./scripts/start.sh > "backend-$S.log" 2>&1 &
            for i in $(seq 1 60); do curl -sf -m 5 http://127.0.0.1:8000/api/status >/dev/null && break; sleep 2; done
            tests/api_flow.sh "$S"
            sudo pkill -f "uvicorn backend.main:app" || true
            sleep 2
          done
          sudo ./scripts/teardown_lab.sh

      - name: Collect lab diagnostics
        if: always()
        run: |
          mkdir -p lab-logs
          {
            echo "## ip netns list"; sudo ip netns list || true
            echo; echo "## nft list ruleset (router namespace)"
            sudo ip netns exec router nft -a list ruleset 2>&1 || echo "(router namespace not present)"
            echo; echo "## nft list tables (host, must not contain the lab table)"; sudo nft list tables || true
            echo; echo "## processes"; ps -eo pid,user,args | grep -E 'postgres|company_app|uvicorn' | grep -v grep || true
          } > lab-logs/state.txt 2>&1
          sudo sh -c 'cp -r /var/lib/cybersec-lab/logs/. lab-logs/ 2>/dev/null; cp /var/lib/cybersec-lab/baseline.rendered.nft lab-logs/ 2>/dev/null; cp backend-*.log lab-logs/ 2>/dev/null; true'
          sudo chown -R "$(id -u):$(id -g)" lab-logs
          ls -la lab-logs

      - name: Upload lab diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-logs-${{ matrix.runner }}
          path: lab-logs/
          if-no-files-found: warn
